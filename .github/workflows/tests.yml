name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv

      - name: Set up Python
        run: uv python install 3.10

      - name: Run unit tests
        run: uv run --python 3.10 python -m unittest discover -s tests -v
